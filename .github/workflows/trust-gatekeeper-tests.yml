name: Trust Gatekeeper tests

on:
  push:
    branches:
      - "research/trust-gatekeeper-foundation"
    paths:
      - "app.py"
      - "tg_rules.py"
      - "tg_demo_cases.py"
      - "tests/test_tg_rules.py"
      - "requirements.txt"
      - ".github/workflows/trust-gatekeeper-tests.yml"
  pull_request:
    paths:
      - "app.py"
      - "tg_rules.py"
      - "tg_demo_cases.py"
      - "tests/test_tg_rules.py"
      - "requirements.txt"
      - ".github/workflows/trust-gatekeeper-tests.yml"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install active app dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile active application and rules
        run: python -m py_compile app.py tg_rules.py tg_demo_cases.py tests/test_tg_rules.py

      - name: Run Trust Gatekeeper unit tests
        run: python -m unittest discover -s tests -v
