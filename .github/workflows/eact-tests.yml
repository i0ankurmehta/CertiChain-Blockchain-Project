name: EACT research tests

on:
  pull_request:
    paths:
      - "eact_rules.py"
      - "pages/**"
      - "tests/**"
      - "research/verification_scenarios.json"
      - "research/EACT_B2_conflict_scenarios.json"
      - ".github/workflows/eact-tests.yml"
  push:
    branches:
      - "feature/eact-v2-multi-finding"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install app dependencies
        run: python -m pip install --upgrade pip streamlit pandas

      - name: Run EACT unit tests
        run: python -m unittest discover -s tests -v
