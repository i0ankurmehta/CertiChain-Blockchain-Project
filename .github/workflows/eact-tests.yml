name: EACT research tests

on:
  pull_request:
    paths:
      - "eact_rules.py"
      - "eact_provenance.py"
      - "eact_trust_lifecycle.py"
      - "pages/**"
      - "tests/**"
      - "research/verification_scenarios.json"
      - "research/EACT_B2_conflict_scenarios.json"
      - "research/EACT_B3_provenance_scenarios.json"
      - "research/EACT_B4_trust_lifecycle_scenarios.json"
      - ".github/workflows/eact-tests.yml"
  push:
    branches:
      - "feature/eact-v2-multi-finding"
      - "feature/eact-b3-provenance-freshness"
      - "feature/eact-b4-trust-anchor-lifecycle"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install app dependencies
        run: python -m pip install --upgrade pip streamlit pandas

      - name: Compile Python source and Streamlit pages
        run: python -m compileall -q app.py eact_rules.py eact_provenance.py eact_trust_lifecycle.py pages tests

      - name: Run EACT unit tests
        run: python -m unittest discover -s tests -v
